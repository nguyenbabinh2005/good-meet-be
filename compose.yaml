services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goodmeet
      POSTGRES_USER: goodmeet
      POSTGRES_PASSWORD: goodmeet
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodmeet -d goodmeet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - goodmeet-postgres-data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.12.0
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro

volumes:
  goodmeet-postgres-data:
